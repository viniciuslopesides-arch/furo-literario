<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Furo Literário</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <img src="logo-admin.png" alt="Furo Literário" class="logo-login">
        
        <h1>Recuperar Senha 🔑</h1>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">
            Digite seu e-mail administrativo para receber o link de redefinição.
        </p>
        
        <input type="email" id="emailRecuperar" placeholder="E-mail cadastrado" required>
        <button id="btnRecuperar">Enviar E-mail</button>
        
        <p id="msgFeedback" class="msg-erro" style="display: none;"></p>
        
        <div class="links-auxiliares">
            <a href="login.html">Voltar para o login</a>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
