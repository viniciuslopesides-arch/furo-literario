<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Furo Literário</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- BIBLIOTECAS: Gráficos e Ícones -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

    <!-- SEÇÃO 1: HEADER (Navegação e Identidade) -->
    <header class="main-header">
        <div class="header-content">
            <img src="logo-admin.png" alt="Furo Literário" class="nav-logo">
            <nav class="nav-user">
                <span id="user-greeting">Carregando...</span>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Painel Administrativo 📚</h1>

        <!-- SEÇÃO 2: MÉTRICAS (Resumo Financeiro e Estoque) -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total em Estoque</h3>
                <p id="total-estoque">0</p>
            </div>
            <div class="stat-card">
                <h3>Lucro Previsto</h3>
                <p id="lucro-total">R$ 0,00</p>
            </div>
        </section>

        <!-- SEÇÃO 3: ANÁLISE VISUAL (Gráficos Dinâmicos) -->
        <section class="graficos-grid">
            <div class="secao chart-container">
                <h2>📦 Monitor de Estoque</h2>
                <canvas id="graficoEstoque"></canvas>
            </div>
            <div class="secao chart-container">
                <h2>💰 Lucro Potencial</h2>
                <canvas id="graficoLucro"></canvas>
            </div>
        </section>

        <!-- SEÇÃO 4: CONFIGURAÇÕES (Frete e Logística) -->
        <section class="secao">
            <h2>🚚 Logística e Entrega</h2>
            <div class="input-inline">
                <input type="number" id="inputTaxa" step="0.01" placeholder="Taxa de Frete (R$)">
                <button id="btnAtualizarTaxa">Atualizar Frete</button>
            </div>
        </section>

        <!-- SEÇÃO 5: CADASTRO (Entrada de Dados e Upload) -->
        <section class="secao">
            <h2 id="tituloForm">📝 Gerenciar Catálogo</h2>
            <div class="form-group">
                <input type="text" id="tituloLivro" placeholder="Título do livro">
                <input type="text" id="autorLivro" placeholder="Autor">
                
                <select id="categoriaLivro">
                    <option value="" disabled selected>Selecione uma categoria</option>
                    <option value="Fantasia Amazonense">Fantasia Amazonense</option>
                    <option value="Fantasia">Fantasia</option>
                    <option value="Ficção">Ficção</option>
                    <option value="Acadêmico">Acadêmico</option>
                    <option value="Outros">Outros</option>
                </select>

                <!-- Bloco de Upload: Aciona o input oculto -->
                <div class="upload-container" onclick="document.getElementById('capaLivro').click()">
                    <label class="label-upload">🖼️ Selecionar Capa do Livro</label>
                    <input type="file" id="capaLivro" accept="image/*" style="display: none;">
                    <progress id="uploadProgress" value="0" max="100"></progress>
                    <small id="nomeArquivo"></small>
                </div>

                <div class="input-row">
                    <input type="number" id="custoLivro" placeholder="Custo (R$)">
                    <input type="number" id="precoLivro" placeholder="Preço Venda (R$)">
                </div>
                
                <input type="number" id="estoqueLivro" placeholder="Quantidade em estoque">
                <button id="btnSalvarLivro" class="btn-primary">Salvar no Acervo</button>
            </div>
        </section>

        <!-- SEÇÃO 6: LISTAGENS (Visualização do Banco de Dados) -->
        <section class="secao">
            <h2>🗂️ Gestão de Inventário</h2>
            <div id="listaLivros" class="data-grid">
                <p class="loading-msg">Sincronizando...</p>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
