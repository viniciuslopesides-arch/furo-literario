<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Furo Literário</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <img src="logo-admin.png" alt="Furo Literário" class="logo-login">
        
        <h1>Acesso Restrito 🔐</h1>
        
        <div id="login-email-area">
            <input type="email" id="email" placeholder="E-mail do administrador">
            <input type="password" id="senha" placeholder="Senha">
            <button id="btnLogin">Entrar no Painel</button>
        </div>

        <div class="links-auxiliares">
            <!-- Link para a outra página -->
            <a href="esqueci-senha.html">Esqueci minha senha</a>
        </div>

        <div class="divisor">ou acesse com</div>

        <div class="metodos-alternativos">
            <button id="btnGoogle" style="background-color: #fff; color: #757575; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
            </button>
            <button id="btnSMS" style="background-color: #34495e;">📱 Via SMS / Telefone</button>
        </div>

        <!-- Área onde o erro de login aparece -->
        <p id="erro" class="msg-erro"></p>
    </div>

    <!-- O mesmo JS unificado serve aqui -->
    <script type="module" src="login.js"></script>
</body>
</html>
