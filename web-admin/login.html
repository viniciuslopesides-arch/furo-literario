<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Furo Literário</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <!-- Verifique se o nome do arquivo da logo está correto na sua pasta -->
        <img src="logo-admin.png" alt="Furo Literário" class="logo-login">
        
        <h1>Acesso Restrito 🔐</h1>
        
        <!-- Seção de Login por E-mail -->
        <div id="login-email-area">
            <input type="email" id="email" placeholder="E-mail do administrador" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button id="btnLogin">Entrar no Painel</button>
        </div>

        <div class="links-auxiliares">
            <a href="esqueci-senha.html">Esqueci minha senha</a>
        </div>

        <div class="divisor">ou acesse com</div>

        <!-- Métodos Sociais (Firebase Providers) -->
        <div class="metodos-alternativos">
            <button id="btnGoogle" style="background-color: #fff; color: #757575; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-bottom: 10px; cursor: pointer; border-radius: 8px; padding: 12px; font-weight: bold;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
            </button>
            <button id="btnSMS" style="background-color: #34495e; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                📱 Via SMS / Telefone
            </button>
        </div>

        <!-- O parágrafo de erro começa vazio e oculto -->
        <p id="erro" class="msg-erro" style="display: none;"></p>
    </div>

    <!-- O login.js unificado lida com a lógica desta página e da esqueci-senha.html -->
    <script type="module" src="login.js"></script>
</body>
</html>
